<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>

    <form action="cadastro.php" method="post" autocomplete="on">

            <p><label for="iest">Estado:</label>
                <select name="est" id="iest">

                    <option value="" selected>---Escolha---</option>
                    <optgroup label="Região Norte">
                        <option value="RS">Acre</option>
                        <option value="MN">Manaus</option>
                        <option value="RO">Roraima</option>
                        <option value="RO">Rondonia</option>
                        <option value="PA" >Para</option>
                        <option value="TO">Tocantins</option>
                    </optgroup>
                    
                    <optgroup label="Região Sudeste">
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="ES">Espirito Santo</option>
                    </optgroup>
                </select>
            </p>

            <p>
                <label for="prof">Profissão:</label>
                <input type="text" name="prof" id="iprof" list="lstprof">
                <datalist id="lstprof">
                    <option >Professor</option>
                    <option >Desenvolvedor</option>
                    <option value="DES">Desing</option>
                    <option value="BOX">Boxeador</option>
                </datalist>
            </p>
            
            <p>
                <label for="imsg">Mensagem:</label><br>
                <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>

    </form>
    
</body>
</html>
