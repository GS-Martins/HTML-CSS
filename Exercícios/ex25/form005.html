<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

            <fieldset>
                <legend>Sexo</legend>

                    <input type="radio" name="sexo" id="isxmas"> <label for="isxmas">Masculino</label> <br>
                    <input type="radio" name="sexo" id="isxfem"> <label for="isxfem">Feminino</label>
                    
            </fieldset>

            <fieldset>
                <legend>Esporte Favorito</legend>

                <input type="checkbox" name="fut" id="ifut"> <label for="ifut">Futebol</label><br>
                <input type="checkbox" name="bas" id="ibas"> <label for="ibas">Basquete</label><br>
                <input type="checkbox" name="box" id="ibox" checked> <label for="ibox">Boxe</label><br>
                <input type="checkbox" name="bjj" id="ibjj" checked> <label for="ibjj">Jiu-Jitsu</label><br>
            </fieldset>            

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>

    </form>
    
</body>
</html>
